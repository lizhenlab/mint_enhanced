# Public-weight compatible experimental recipe; use an official TRAIN native MANO dataset version.
model:
  name: split_fov_head
  pretrained: null
  enable_hand: true
  hand_head: {name: refine, dim: 512, num_queries: 4, num_iterations: 2, trunk_depth: 1, rotation_refine_mode: compose_axis_angle, rotation_delta_frame: local, rotation_delta_max_angle_deg: 30.0}
  enable_hand_presence: true
  hand_presence_head: {dim: 256, num_heads: 4}
  fov_head: {dim: 512, num_heads: 8, trunk_depth: 2, initial_fov_deg: [60.0, 75.0], min_fov_rad: 1.0e-4}
  backbone: {img_size: 518, patch_size: 14, embed_dim: 1024, use_sdpa: true, use_gradient_checkpoint: false, camera_num_iterations: 4, enable_camera: true, enable_depth: false, enable_point: false, enable_local_point: false}
  freeze: ['backbone.*']
data:
  name: lerobot_v3
  root: data/lerobot/native_train/lerobot_v3
  sample_seed: 42
  camera_translation_normalization: {enabled: false}
  clip_len: 32
  clip_stride: 32
  size_hw: [378, 518]
  batch_size: 1
  num_workers: 2
  shuffle: true
  require_mano_gt: true
  require_kpt21_gt: false
  allow_pseudo_labels: false
loss:
  hand_presence: {weight: 1.0}
  mano_param:
    weight: 1.0
    terms:
      - {name: transl_l1, weight: 2.0}
      - {name: orient_geo, weight: 1.0}
      - {name: pose_geo, weight: 1.0}
      - {name: betas_l1, weight: 0.3}
train:
  run_name: native_mano_finetune
  init_from: checkpoints/model.safetensors
  reproducibility: {enabled: true, seed: 42, deterministic_algorithms: false}
  max_steps: 1000
  log_every: 5
  ckpt_every: 100
  grad_clip: 0.0
  grad_value_clip: 1.0
  grad_accum: 1
  mixed_precision: bf16
  wandb: {enabled: false}
optim:
  lr: 1.0e-5
  weight_decay: 0.05
  warmup_steps: 20
  param_groups:
    - {match: hand_head, lr: 1.0e-5, grad_value_clip: 1.0}
    - {match: hand_presence_head, lr: 1.0e-5, grad_value_clip: 1.0}
dist: {nnodes: 1, gpus_per_node: 2, master_addr: 127.0.0.1, master_port: 29500}
